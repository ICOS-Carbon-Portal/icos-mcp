[project]
name = "icos-mcp"
version = "0.2.0"
description = "ICOS carbon and greenhouse-gas observations for AI assistants, over MCP"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Vermeulen", email = "alex.vermeulen@icos-ri.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numcodecs>=0.17.1",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
icos-mcp = "icos_mcp.server:main"
